<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#9BA0E0">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>MEDex</title>
<style>
:root{color-scheme:light;--ink:#111827;--sub:#6B7280;--line:#E5E7EB;--bg:#F9FAFB;--acc:#2563EB}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif}
button{font:inherit;color:inherit}
.screen{display:none;height:100dvh;flex-direction:column}
.screen.on{display:flex}
header.bar{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:#fff;border-bottom:1px solid var(--line)}
header.bar h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{min-width:40px;height:40px;border:0;border-radius:10px;background:transparent;font-size:18px;padding:0 8px}
.ib:active{background:rgba(0,0,0,.08)}
.msg{padding:6px 14px;font-size:13px;color:var(--sub);min-height:28px}
.msg.err{color:#B91C1C}
#login{align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#login h1{font-size:30px;margin:0}
#login p{color:var(--sub);margin:0;line-height:1.5}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 18px;font-size:16px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
#list{overflow:auto;flex:1;padding:6px 12px 24px}
.row{display:flex;align-items:center;gap:6px;width:100%;background:#fff;border-radius:14px;margin:8px 0;padding:4px 4px 4px 14px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.row .main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:10px 0}
.row .more{flex:none;width:44px;height:44px;border:0;border-radius:10px;background:transparent;font-size:20px;color:var(--sub)}
.row .more:active{background:rgba(0,0,0,.08)}
.page{overflow:auto;flex:1;padding:6px 14px 40px}
.sec{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sec h4{margin:0 0 10px;font-size:14px;color:var(--sub);font-weight:600}
.sec label{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:16px}
.sec input[type=checkbox]{width:22px;height:22px}
.sec input[type=range]{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:20px;padding:4px 4px 4px 10px;min-height:42px}
.chip button{border:0;background:transparent;font-size:15px;padding:6px 6px;color:var(--sub)}
.grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;max-height:46vh;overflow:auto}
.grid button{min-width:46px;height:46px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:22px;padding:0 8px}
.sheetbtn{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:14px 8px;font-size:17px}
.sheetbtn:active{background:#F3F4F6}.sheetbtn.danger{color:#B91C1C}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}.sw i{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 1px #9CA3AF}
.tr{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;margin:8px 0;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tr .dot{width:12px;height:30px;border-radius:6px;flex:none}.tr .t{flex:1;min-width:0}.tr .t b{display:block}.tr .t span{font-size:13px;color:var(--sub)}
.tr button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:14px}
.row .dot{width:14px;height:34px;border-radius:7px;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .star{color:#F59E0B}
#editor{background:var(--tint,#fff)}
.tools{display:flex;gap:4px;padding:6px 8px;background:rgba(255,255,255,.75);border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tools button{flex:none;min-width:42px;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;padding:0 10px}
.tools button:active,.tools button.on{background:#E5E7EB}
.tools .sep{width:6px;flex:none}
#pal{display:none;flex-wrap:wrap;gap:8px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line)}
#pal.on{display:flex}
#pal i{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #9CA3AF}
#body{flex:1;overflow:auto;padding:14px 14px 40vh;font-size:17px;line-height:1.55;white-space:pre-wrap;word-break:break-word;outline:none;color:var(--ink);-webkit-user-select:text;user-select:text;caret-color:var(--ink)}
::highlight(done){text-decoration:line-through}
#title{flex:1;min-width:0;font-size:18px;font-weight:700;border:0;background:transparent;padding:6px;border-radius:8px;color:var(--ink)}
#title:focus{outline:2px solid var(--acc);background:#fff}
dialog{border:0;border-radius:16px;padding:20px;width:min(92vw,360px);box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 10px;font-size:17px}
dialog input{width:100%;font-size:17px;padding:10px;border:1px solid #9CA3AF;border-radius:10px;margin-bottom:12px}
dialog .acts{display:flex;gap:8px;justify-content:flex-end}
.spin{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.6);font-size:16px;z-index:9}
.spin.on{display:flex}
</style>
</head>
<body>

<section id="login" class="screen on">
  <h1>MEDex</h1>
  <p>PC의 MEDex와 같은 Google 계정으로 로그인하면<br>메모를 불러와서 수정할 수 있어요.</p>
  <button class="btn pri" id="btnLogin">Google 계정으로 로그인</button>
  <div class="msg" id="loginMsg"></div>
</section>

<section id="listScr" class="screen">
  <header class="bar">
    <h1>MEDex</h1>
    <button class="ib" id="btnAdd" title="새 인덱스">＋</button>
    <button class="ib" id="btnRefresh" title="새로고침">⟳</button>
    <button class="ib" id="btnSet" title="설정">⚙</button>
  </header>
  <div class="msg" id="listMsg"></div>
  <div id="list"></div>
</section>

<section id="editor" class="screen">
  <header class="bar">
    <button class="ib" id="btnBack" title="목록">‹</button>
    <input id="title" aria-label="인덱스 이름" maxlength="40">
    <button class="ib" id="btnSave" title="저장 (Ctrl+S)">저장</button>
    <button class="ib" id="btnMenu" title="더보기">⋯</button>
  </header>
  <div class="tools" id="tools">
    <button data-a="small" title="작게" style="font-size:12px">가</button>
    <button data-a="normal" title="기본">가</button>
    <button data-a="large" title="크게" style="font-size:19px">가</button>
    <span class="sep"></span>
    <button data-a="bold" title="굵게 (Ctrl+B)"><b>B</b></button>
    <button data-a="underline" title="밑줄 (Ctrl+U)"><u>U</u></button>
    <button data-a="color" title="글자 색"><span id="colA" style="border-bottom:4px solid #111827">A</span></button>
    <span class="sep"></span>
    <button data-a="box" title="체크박스">□</button>
    <button data-a="sym" title="즐겨찾는 기호">★</button>
    <span class="sep"></span>
    <button data-a="undo" title="되돌리기 (Ctrl+Z)">↶</button>
    <button data-a="redo" title="다시 실행 (Ctrl+Y)">↷</button>
  </div>
  <div id="pal"></div>
  <div class="msg" id="edMsg"></div>
  <div id="body" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off"></div>
</section>

<section id="setScr" class="screen">
  <header class="bar"><button class="ib" id="setBack">‹</button><h1>설정</h1></header>
  <div class="page" id="setBody"></div>
</section>

<section id="trashScr" class="screen">
  <header class="bar"><button class="ib" id="trBack">‹</button><h1>휴지통</h1><button class="ib" id="trEmpty" style="font-size:14px">비우기</button></header>
  <div class="msg" id="trMsg"></div>
  <div class="page" id="trBody"></div>
</section>

<dialog id="sheet"><h3 id="sheetT"></h3><div id="sheetB"></div><div class="acts"><button class="btn" id="sheetX">닫기</button></div></dialog>
<dialog id="dlg"><h3 id="dlgT"></h3><input id="dlgI"><div class="acts"><button class="btn" id="dlgNo">취소</button><button class="btn pri" id="dlgOk">확인</button></div></dialog>
<div class="spin" id="spin">잠시만요…</div>

<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
"use strict";
/* ===== 상수 (PC 앱 MEDex.py와 같은 데이터 형식) ===== */
const DRIVE = "https://www.googleapis.com/drive/v3", UPLOAD = "https://www.googleapis.com/upload/drive/v3";
const NAMES = ["MEDex_notes.json", "medex_notes.json", "dockmemo_notes.json"];
const SCOPE = "https://www.googleapis.com/auth/drive.appdata openid https://www.googleapis.com/auth/userinfo.email";
const PALETTE = ["#F2C94C", "#7FD1C4", "#F5A28C", "#A9C7F5", "#C9B6F2"];
const TEXT_DEFAULT = "#111827", PW_ROUNDS = 150000;
const BOX_OFF = "☐", BOX_ON = "☑";
const SWATCH = ["#111827", "#DC2626", "#EA580C", "#CA8A04", "#16A34A", "#0891B2", "#2563EB", "#7C3AED", "#DB2777", "#6B7280"];
const $ = s => document.querySelector(s);
const enc8 = new TextEncoder(), dec8 = new TextDecoder();

/* ===== 공통 도우미 ===== */
function crc32(str) {
  if (!crc32.t) { crc32.t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; crc32.t[n] = c >>> 0; } }
  let c = 0xFFFFFFFF; for (const b of enc8.encode(str)) c = crc32.t[(c ^ b) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
const hexToBytes = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
const bytesToHex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
const b64 = u8 => btoa(String.fromCharCode(...u8));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function validPw(pw) { return pw && typeof pw.s === "string" && typeof pw.h === "string" && pw.s && pw.h; }
function validEnc(e) { return e && typeof e.n === "string" && typeof e.c === "string"; }
function say(id, t, err) { const e = $(id); e.textContent = t || ""; e.classList.toggle("err", !!err); }
function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }
function busy(on) { $("#spin").classList.toggle("on", on); }
function tint(hex, k = 0.85) { const n = parseInt(hex.slice(1), 16); const f = v => Math.round(v * (1 - k) + 255 * k); return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`; }

/* ===== 암호 (PC 앱과 동일: PBKDF2-SHA256 150000회, AES-GCM) ===== */
async function pbkdf2(password, saltBytes) {
  const k = await crypto.subtle.importKey("raw", enc8.encode(password), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: saltBytes, iterations: PW_ROUNDS }, k, 256));
}
async function encKey(saltHex, password) {
  const salt = new Uint8Array([...hexToBytes(saltHex), ...enc8.encode("|enc")]);
  return await crypto.subtle.importKey("raw", await pbkdf2(password, salt), "AES-GCM", false, ["encrypt", "decrypt"]);
}
async function unlockKey(pw, password) {
  const h = await pbkdf2(password, hexToBytes(pw.s));
  if (bytesToHex(h) !== pw.h) return null;
  return await encKey(pw.s, password);
}
async function makePw(password) {
  const s = bytesToHex(crypto.getRandomValues(new Uint8Array(16)));
  return { pw: { s, h: bytesToHex(await pbkdf2(password, hexToBytes(s))) }, key: await encKey(s, password) };
}
const MAX_FAV = 2, MAX_SYMBOLS = 50, MAX_SYMBOL_LEN = 20, TRASH_DAYS = 30, PW_RULE = /^[A-Za-z][0-9]{4}$/;
function normalizeNotes(d) {
  let c = 0;
  for (const n of d.notes) { if (n.fav && ++c > MAX_FAV) n.fav = false; }
  d.notes = d.notes.map((n, i) => [n, i]).sort((a, b) => (b[0].fav ? 1 : 0) - (a[0].fav ? 1 : 0) || a[1] - b[1]).map(x => x[0]);
}
async function decryptPayload(key, e) {
  const raw = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(e.n) }, key, unb64(e.c));
  return JSON.parse(dec8.decode(raw));
}
async function encryptPayload(key, payload) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc8.encode(JSON.stringify(payload))));
  return { n: b64(iv), c: b64(ct) };
}

/* ===== Google 로그인 / Drive ===== */
let tokenClient = null, token = null, tokenExp = 0, accountEmail = "";
function gsiReady() { return window.google && google.accounts && google.accounts.oauth2; }
function waitGsi() { return new Promise((res, rej) => { let n = 0; const t = setInterval(() => { if (gsiReady()) { clearInterval(t); res(); } else if (++n > 100) { clearInterval(t); rej(new Error("Google 로그인 스크립트를 불러오지 못했어요 (인터넷 연결 확인)")); } }, 100); }); }
function getToken(interactive) {
  if (token && Date.now() < tokenExp - 60000) return Promise.resolve(token);
  return new Promise(async (res, rej) => {
    try {
      await waitGsi();
      const id = window.MEDEX_CLIENT_ID || "";
      if (!id || id.startsWith("여기에")) throw new Error("config.js에 웹 클라이언트 ID를 먼저 입력해야 해요 (README 참고)");
      if (!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({ client_id: id, scope: SCOPE, callback: () => {} });
      tokenClient.callback = r => { if (r.error) return rej(new Error(r.error_description || r.error)); token = r.access_token; tokenExp = Date.now() + (r.expires_in || 3600) * 1000; res(token); };
      tokenClient.error_callback = e => rej(new Error(e && e.type === "popup_closed" ? "로그인이 취소됐어요" : "로그인하지 못했어요 (" + (e && e.type || "오류") + ")"));
      tokenClient.requestAccessToken({ prompt: interactive ? "select_account" : "" });
    } catch (e) { rej(e); }
  });
}
async function api(url, opt = {}, retry = true) {
  const t = await getToken(false);
  const r = await fetch(url, { ...opt, headers: { ...(opt.headers || {}), Authorization: "Bearer " + t } });
  if (r.status === 401 && retry) { token = null; return api(url, opt, false); }
  if (!r.ok) throw new Error("Drive 오류 " + r.status);
  return r;
}
async function findFile() {
  for (const name of NAMES) {
    const r = await (await api(`${DRIVE}/files?spaces=appDataFolder&q=${encodeURIComponent(`name='${name}'`)}&fields=files(id)`)).json();
    if (r.files && r.files.length) return r.files[0].id;
  }
  return null;
}
async function download() {
  const id = await findFile();
  if (!id) return null;
  const data = JSON.parse(await (await api(`${DRIVE}/files/${id}?alt=media`)).text());
  if (!data || !Array.isArray(data.notes) || !data.notes.length) throw new Error("저장된 메모 형식이 올바르지 않아요");
  return { id, data };
}
async function upload(id, obj) {
  const r = await api(`${UPLOAD}/files/${id}?uploadType=media&fields=modifiedTime`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(obj) });
  try { S.mod = (await r.json()).modifiedTime || S.mod; } catch (_) {}
}
/* 저장은 항상 [Drive에서 최신본 받기 → 이 인덱스만 고치기 → 올리기]. 다른 기기에서 고친 다른 인덱스를 덮어쓰지 않는다. */
let chain = Promise.resolve();
let pending = 0;
function commit(mutator) {
  pending++;
  const job = chain.then(async () => {
    const r = await download();
    if (!r) throw new Error("Drive에 MEDex 메모가 아직 없어요. PC의 MEDex에서 먼저 로그인해 주세요.");
    await mutator(r.data);
    normalizeNotes(r.data);
    r.data.updated = Date.now() / 1000;
    await upload(r.id, r.data);
    S.fileId = r.id; S.data = r.data;
    return r.data;
  });
  chain = job.catch(() => {});
  job.then(() => { pending--; }, () => { pending--; });
  return job;
}

/* ===== 상태 ===== */
const S = { fileId: null, data: null, cur: null /* {ref,pwKey,pwSalt,title} */ };
function findNote(d, ref) {
  if (!ref) return -1;
  const ok = (n) => n.title === ref.title && n.color === ref.color;
  if (d.notes[ref.idx] && ok(d.notes[ref.idx])) return ref.idx;
  let i = d.notes.findIndex(ok); if (i >= 0) return i;
  return d.notes.findIndex(n => n.title === ref.title);
}

/* ===== 목록 ===== */
function noteSummary(n) {
  if (validPw(n.pw)) return "암호로 보호된 인덱스";
  const t = (n.text || "").replace(/[☐☑]/g, "").trim().split("\n")[0] || "(비어 있음)";
  return t;
}
function renderList() {
  const box = $("#list"); box.textContent = "";
  S.data.notes.forEach((n, i) => {
    const row = document.createElement("div"); row.className = "row";
    const m = document.createElement("button"); m.className = "main";
    const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = n.color || "#ccc";
    const t = document.createElement("span"); t.className = "t";
    const h = document.createElement("b"); h.textContent = (n.fav ? "★ " : "") + n.title; if (n.fav) h.className = "star";
    const sm = document.createElement("span"); sm.textContent = noteSummary(n);
    t.append(h, sm); m.append(dot, t); m.onclick = () => openNote(i);
    const more = document.createElement("button"); more.className = "more"; more.textContent = "⋯"; more.title = "더보기"; more.onclick = () => noteMenu(i);
    row.append(m, more); box.append(row);
  });
}
async function refreshList(quiet) {
  if (!quiet) busy(true);
  try {
    const r = await download();
    if (!r) { say("#listMsg", "Drive에 MEDex 메모가 아직 없어요. PC의 MEDex에서 먼저 로그인해 주세요.", true); S.data = { notes: [] }; renderList(); return; }
    S.fileId = r.id; S.data = r.data; renderList(); try { S.mod = (await (await api(`${DRIVE}/files/${r.id}?fields=modifiedTime`)).json()).modifiedTime; } catch (_) {}
    say("#listMsg", (accountEmail ? accountEmail + " · " : "") + "인덱스 " + r.data.notes.length + "개");
    purgeExpired();
  } catch (e) { say("#listMsg", e.message, true); }
  finally { busy(false); }
}

/* ===== 편집기: 글자+서식 <-> 화면 ===== */
const body = $("#body");
function flagsOf(f) { return { b: !!(f & 1), u: !!(f & 2), sz: f & 4 ? -1 : f & 8 ? 1 : 0 }; }
function makeSpan(s, f, col) {
  const st = flagsOf(f), sp = document.createElement("span");
  if (st.b) sp.style.fontWeight = "bold";
  if (st.u) sp.style.textDecoration = "underline";
  if (st.sz) { sp.dataset.sz = st.sz; sp.style.fontSize = st.sz < 0 ? "0.6667em" : "1.5em"; }
  if (col) sp.style.color = col;
  sp.textContent = s; return sp;
}
function renderBody(text, runs) {
  body.textContent = "";
  let pos = 0;
  const rs = (runs || []).map(r => [r[0] | 0, r[1] | 0, r[2] | 0, r[3] || ""]).filter(r => r[1] > r[0]).sort((a, b) => a[0] - b[0]);
  for (const [a, b, f, c] of rs) {
    if (a < pos || b > text.length) continue;
    if (a > pos) body.append(document.createTextNode(text.slice(pos, a)));
    body.append(makeSpan(text.slice(a, b), f, c)); pos = b;
  }
  if (pos < text.length) body.append(document.createTextNode(text.slice(pos)));
  ensureSentinel(); updateStrike();
}
function ensureSentinel() {
  const l = body.lastChild;
  if (!(l && l.nodeType === 1 && l.dataset && l.dataset.s)) { const br = document.createElement("br"); br.dataset.s = "1"; body.append(br); }
}
function rgbHex(c) {

  const g = document.createElement("div"); g.className = "grid";
  if (!syms.length) g.textContent = "등록한 기호가 없어요";
  for (const sy of syms) { const b = document.createElement("button"); b.textContent = sy; b.onclick = () => { $("#sheet").close(); insertText(sy); }; g.append(b); }
  const add = { label: "＋ 새 기호 등록", fn: async () => { await addSymbol(); symbolSheet(); } };
  sheet("즐겨찾는 기호", [{ node: g }, add]);
}
function insertText(t) {
  body.focus();
  if (savedRange) { const s = getSelection(); s.removeAllRanges(); s.addRange(savedRange); }
  document.execCommand("insertText", false, t); updateStrike(); markDirty();
}
async function addSymbol() {
  const t = await ask("등록할 기호나 이모티콘 (최대 " + MAX_SYMBOL_LEN + "자)"); if (t === null || !t.trim()) return;
  const v = t.trim().slice(0, MAX_SYMBOL_LEN), list = [...((S.data && S.data.symbols) || [])];
  if (list.includes(v)) return;
  if (list.length >= MAX_SYMBOLS) { await info("기호는 최대 " + MAX_SYMBOLS + "개까지 등록할 수 있어요"); return; }
  busy(true); try { await commit(d => { d.symbols = [...(d.symbols || []).filter(x => x !== v), v].slice(0, MAX_SYMBOLS); }); } catch (e) { say("#edMsg", e.message, true); } finally { busy(false); }
}
$("#tools").addEventListener("click", e => { const b = e.target.closest("button"); if (b && b.dataset.a === "sym") symbolSheet(); });

/* ===== 설정 ===== */
async function setSetting(patch) {
  try { await commit(d => Object.assign(d, patch)); } catch (e) { say("#setMsg", e.message, true); }
  renderSettings(); updateStrike();
}
function renderSettings() {
  const b = $("#setBody"), d = S.data || {}; b.textContent = "";
  const sec = (h, ...kids) => { const x = document.createElement("div"); x.className = "sec"; const t = document.createElement("h4"); t.textContent = h; x.append(t, ...kids); b.append(x); return x; };
  const check = (label, val, key) => { const l = document.createElement("label"), c = document.createElement("input"); c.type = "checkbox"; c.id = "set_" + key; c.checked = val; c.onchange = () => setSetting({ [key]: c.checked }); l.append(c, label); return l; };
  const ac = document.createElement("div"); ac.textContent = accountEmail ? "연결 중인 Google 계정: " + accountEmail : "Google 계정으로 로그인됨";
  const out = document.createElement("button"); out.className = "btn"; out.id = "btnLogout"; out.textContent = "로그아웃"; out.style.marginTop = "10px"; out.onclick = logout;
  sec("계정", ac, out);
  sec("저장", check("자동 저장 (끄면 '저장' 버튼으로만 저장)", d.autosave !== false, "autosave"), check("체크박스에 체크 시 선 긋기", d.strike_done !== false, "strike_done"));
  const op = document.createElement("input"); op.type = "range"; op.id = "set_opacity"; op.min = 10; op.max = 100; op.value = d.opacity || 100;
  const ol = document.createElement("span"); ol.textContent = op.value + "%"; op.oninput = () => { ol.textContent = op.value + "%"; }; op.onchange = () => setSetting({ opacity: +op.value });
  const orow = document.createElement("label"); orow.append(op, ol);
  const tl = document.createElement("div");
  for (const [up, t] of [[false, "90도 회전"], [true, "정방향"]]) { const l = document.createElement("label"), r = document.createElement("input"); r.type = "radio"; r.name = "tu"; r.id = "set_tu_" + up; r.checked = !!d.tab_upright === up; r.onchange = () => setSetting({ tab_upright: up }); l.append(r, t); tl.append(l); }
  sec("PC 화면 설정 (PC의 인덱스·메모창에 적용돼요)", Object.assign(document.createElement("div"), { textContent: "불투명도" }), orow, Object.assign(document.createElement("div"), { textContent: "인덱스 제목 표시" }), tl);
  const chips = document.createElement("div"); chips.className = "chips";
  const syms = d.symbols || [];
  const saveSyms = l => setSetting({ symbols: l });
  syms.forEach((sy, k) => {
    const c = document.createElement("span"); c.className = "chip"; c.append(sy);
    const mk = (t, f) => { const x = document.createElement("button"); x.textContent = t; x.onclick = f; return x; };
    c.append(mk("◀", () => { if (k > 0) { const l = [...syms]; [l[k - 1], l[k]] = [l[k], l[k - 1]]; saveSyms(l); } }), mk("▶", () => { if (k < syms.length - 1) { const l = [...syms]; [l[k + 1], l[k]] = [l[k], l[k + 1]]; saveSyms(l); } }), mk("✕", () => saveSyms(syms.filter((_, j) => j !== k))));
    chips.append(c);
  });
  const ad = document.createElement("button"); ad.className = "btn"; ad.id = "btnAddSym"; ad.textContent = "＋ 기호 등록"; ad.style.marginTop = "10px"; ad.onclick = async () => { await addSymbol(); renderSettings(); };
  sec("즐겨찾는 기호", chips, ad);
  const tb = document.createElement("button"); tb.className = "btn"; tb.id = "btnTrash"; tb.textContent = "휴지통 열기 (" + (d.trash || []).length + "개)"; tb.onclick = () => { renderTrash(); push("trashScr"); };
  sec("휴지통", tb);
  const m = document.createElement("div"); m.id = "setMsg"; m.className = "msg"; b.append(m);
}
$("#btnSet").onclick = () => { renderSettings(); push("setScr"); };
$("#setBack").onclick = () => history.back();
$("#trBack").onclick = () => history.back();
function logout() {
  if (token && gsiReady()) try { google.accounts.oauth2.revoke(token, () => {}); } catch (_) {}
  token = null; tokenExp = 0; accountEmail = ""; S.data = null; S.cur = null;
  try { localStorage.removeItem("medex_signed"); localStorage.removeItem("medex_draft"); } catch (_) {}
  show("login");
}

/* ===== 휴지통 ===== */
const dayStr = t => { const x = new Date(t * 1000), z = v => String(v).padStart(2, "0"); return x.getFullYear() + "-" + z(x.getMonth() + 1) + "-" + z(x.getDate()) + " " + z(x.getHours()) + ":" + z(x.getMinutes()); };
function renderTrash() {
  const b = $("#trBody"), t = (S.data && S.data.trash) || []; b.textContent = "";
  say("#trMsg", t.length ? "삭제한 인덱스는 " + TRASH_DAYS + "일 동안 보관된 뒤 자동으로 완전 삭제돼요" : "휴지통이 비어 있어요");
  t.forEach(e => {
    const r = document.createElement("div"); r.className = "tr";
    const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = e.note.color || "#ccc";
    const tt = document.createElement("span"); tt.className = "t";
    const left = Math.max(0, Math.ceil((e.deleted + TRASH_DAYS * 86400 - Date.now() / 1000) / 86400));
    const h = document.createElement("b"); h.textContent = e.note.title; const sp = document.createElement("span"); sp.textContent = "삭제 " + dayStr(e.deleted) + " · " + left + "일 후 자동 삭제";
    tt.append(h, sp);
    const key = x => x.deleted === e.deleted && x.note.title === e.note.title;
    const re = document.createElement("button"); re.textContent = "복원"; re.className = "tr_restore";
    re.onclick = async () => { busy(true); try { await commit(d => { const j = (d.trash || []).findIndex(key); if (j < 0) throw new Error("이미 처리된 항목이에요"); const [x] = d.trash.splice(j, 1); delete x.note.fav; d.notes.push(x.note); }); } catch (er) { say("#trMsg", er.message, true); } finally { busy(false); } renderTrash(); };
    const de = document.createElement("button"); de.textContent = "삭제"; de.className = "tr_delete";
    de.onclick = async () => { if (!(await ask("'" + e.note.title + "'을(를) 완전히 삭제할까요? 되돌릴 수 없어요.", { noInput: true }))) return; busy(true); try { await commit(d => { d.trash = (d.trash || []).filter(x => !key(x)); }); } catch (er) { say("#trMsg", er.message, true); } finally { busy(false); } renderTrash(); };
    r.append(dot, tt, re, de); b.append(r);
  });
}
$("#trEmpty").onclick = async () => {
  const t = (S.data.trash || []); if (!t.length) return;
  if (!(await ask("휴지통의 모든 인덱스를 완전히 삭제할까요? 되돌릴 수 없어요.", { noInput: true }))) return;
  busy(true); try { const keys = new Set(t.map(e => e.deleted + "|" + e.note.title)); await commit(d => { d.trash = (d.trash || []).filter(x => !keys.has(x.deleted + "|" + x.note.title)); }); } catch (er) { say("#trMsg", er.message, true); } finally { busy(false); }
  renderTrash();
};
async function purgeExpired() {
  const lim = Date.now() / 1000 - TRASH_DAYS * 86400;
  if (!S.data || !(S.data.trash || []).some(e => e.deleted <= lim)) return;
  try { await commit(d => { d.trash = (d.trash || []).filter(e => e.deleted > lim); }); } catch (_) {}
}

$("#btnAdd").onclick = async () => {
  const t = await ask("새 인덱스 이름", { value: "새 메모" }); if (t === null) return;
  busy(true);
  try {
    let k = 0;
    await commit(d => { k = d.notes.length; d.notes.push({ title: (t.trim() || "새 메모").slice(0, 40), color: PALETTE[k % PALETTE.length], text: "" }); });
    renderList(); busy(false); openNote(S.data.notes.length - 1);
  } catch (e) { say("#listMsg", e.message, true); }
  finally { busy(false); }
};
$("#btnRefresh").onclick = () => refreshList(false);

/* ===== 다른 기기(PC 등)의 변경을 5초 안에 반영 ===== */
let polling = false;
function caretOffset() {
  const s = getSelection(); if (!s.rangeCount || !body.contains(s.anchorNode)) return null;
  const r = document.createRange(); r.selectNodeContents(body); r.setEnd(s.anchorNode, s.anchorOffset); return r.toString().length;
}
function setCaretOffset(off) {
  const w = document.createTreeWalker(body, NodeFilter.SHOW_TEXT); let n, left = off;
  while ((n = w.nextNode())) { if (left <= n.data.length) { const r = document.createRange(); r.setStart(n, left); r.collapse(true); const s = getSelection(); s.removeAllRanges(); s.addRange(r); return; } left -= n.data.length; }
}
async function applyRemote(nd) {
  const st = document.querySelector(".screen.on").id;
  S.data = nd;
  if (st === "listScr") { renderList(); say("#listMsg", (accountEmail ? accountEmail + " · " : "") + "다른 기기의 변경을 불러왔어요"); }
  else if (st === "setScr") renderSettings();
  else if (st === "trashScr") renderTrash();
  else if (st === "editor" && S.cur) {
    const i = findNote(nd, S.cur.ref);
    const leave = msg => { S.cur = null; dirty = false; show("listScr"); renderList(); say("#listMsg", msg, true); };
    if (i < 0) return leave("다른 기기에서 이 인덱스가 바뀌거나 삭제됐어요");
    const n = nd.notes[i];
    let text = n.text || "", fmt = n.fmt, fsig = n.fsig;
    if (S.cur.salt || validPw(n.pw)) {
      if (!S.cur.key || !validPw(n.pw) || n.pw.s !== S.cur.salt) return leave("다른 기기에서 암호가 바뀌었어요. 다시 열어 주세요");
      if (validEnc(n.enc)) { const p = await decryptPayload(S.cur.key, n.enc); text = p.text || ""; fmt = p.fmt; fsig = p.fsig; }
    }
    const runs = fmt && fsig === crc32(text) ? fmt : [];
    if (dirty) return;  // 그 사이 입력을 시작했으면 건드리지 않는다
    S.cur.ref = { idx: i, title: n.title, color: n.color };
    if (document.activeElement !== $("#title")) $("#title").value = n.title;
    $("#editor").style.setProperty("--tint", tint(n.color || "#F2C94C"));
    const now = serialize();
    if (now.text !== text || JSON.stringify(now.runs) !== JSON.stringify(runs)) {
      const off = caretOffset(), top = body.scrollTop;
      renderBody(text, runs);
      if (off !== null) setCaretOffset(Math.min(off, text.length));
      body.scrollTop = top; say("#edMsg", "다른 기기의 변경을 불러왔어요");
    } else updateStrike();
  }
}
async function pollRemote() {
  if (polling || !token || !S.data || !S.fileId || document.hidden || pending || saving || dirty || document.querySelector("dialog[open]") || $("#spin").classList.contains("on")) return;
  polling = true;
  try {
    const m = await (await api(`${DRIVE}/files/${S.fileId}?fields=modifiedTime`)).json();
    if (m.modifiedTime === S.mod) return;
    const r = await download(); if (!r) return;
    S.mod = m.modifiedTime;
    if (pending || saving || dirty) return;
    if ((r.data.updated || 0) > (S.data.updated || 0) + 0.0005) { S.fileId = r.id; await applyRemote(r.data); }
  } catch (_) {} finally { polling = false; }
}
setInterval(pollRemote, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollRemote(); });
window.addEventListener("online", pollRemote);

/* ===== 로그인 / 로그아웃 ===== */
async function afterLogin() {
  try { const u = await (await api("https://www.googleapis.com/oauth2/v3/userinfo")).json(); accountEmail = u.email || ""; } catch (_) {}
  try { localStorage.setItem("medex_signed", "1"); } catch (_) {}
  show("listScr"); await refreshList(false);
}
$("#btnLogin").onclick = async () => {
  say("#loginMsg", "");
  try { await getToken(true); await afterLogin(); } catch (e) { say("#loginMsg", e.message || String(e), true); }
};
document.addEventListener("visibilitychange", () => { if (document.hidden && dirty) saveNow(false); });
window.addEventListener("pagehide", () => { if (dirty) saveNow(false); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
(async () => {
  let signed = false; try { signed = localStorage.getItem("medex_signed") === "1"; } catch (_) {}
  if (!signed) return;
  say("#loginMsg", "로그인 확인 중…");
  try { await getToken(false); await afterLogin(); } catch (e) { say("#loginMsg", "다시 로그인해 주세요"); }
})();
window.__medex = { logout,  serialize, renderBody, S, crc32, unlockKey, decryptPayload, encryptPayload, updateStrike };
</script>
